<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <head>
        <title>Newsletter</title>
        <link rel="stylesheet" href="format.css">
        <nav>
            <a href="Welcome.html">Welcome</a>
            <a href="Homepage.html">Homepage</a>
            <a href="Produse.html">Produse</a>
        </nav>
    </head>
    <body>
        <h2>Abonare Newsletter</h2>

        <form action="/action_page.php">
            <div class="container header-container">
                <h2>Abonati-va la newsletter-ul nostru</h2>
                <p>Introduceti datele de contact mai jos</p>
            </div>

            <div class="container">
                <input type="text" placeholder="Nume" name="name" required>
                <input type="text" placeholder="Adresa de email" name="mail" required>
                <label>
                    <input type="checkbox" checked="checked" name="subscribe">
                    <span class="checkbox-label">Daily Newsletter</span>
                </label>
            </div>

            <div class="container">
                <input type="submit" value="Subscribe">
            </div>
        </form>
    </body>
</html>
