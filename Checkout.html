<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizare Comandă</title>
    <link rel="stylesheet" href="format.css">
</head>
<body>

    <div class="grid-container">
        
        <header class="site-header">
            <h1>Finalizare Comandă</h1>
        </header>

        <nav class="site-nav">
            <a href="Homepage.html">Homepage</a>
            <a href="Drone.php">Drone</a>
            <a href="Accesorii.php">Accesorii</a>
            <a href="Newsletter.html">Newsletter</a>
            <a href="Checkout.html" class="active">Checkout</a>
        </nav>

        <main class="site-main">
            
            <form id="formular-comanda" onsubmit="trimiteComanda(event)">
                <div class="checkout-layout">
                    
                    <div class="form-section">
                        <h2>Date de livrare</h2>
                        
                        <h3>Cine primește comanda?</h3>
                        <div class="row-inputs">
                            <input type="text" class="custom-input" placeholder="Nume" required>
                            <input type="text" class="custom-input" placeholder="Prenume" required>
                        </div>
                        
                        <input type="email" class="custom-input" placeholder="Adresa de Email" required>
                        <input type="tel" class="custom-input" placeholder="Telefon (curier)" required>

                        <h3>Unde livrăm?</h3>
                        <input type="text" class="custom-input" placeholder="Adresa completă (Strada, Număr, Bloc...)" required>
                        
                        <div class="row-inputs">
                            <input type="text" class="custom-input" placeholder="Județ" required>
                            <input type="text" class="custom-input" placeholder="Oraș" required>
                            <input type="text" class="custom-input" placeholder="Cod Poștal">
                        </div>

                        <h3>Observații (Opțional)</h3>
                        <textarea class="custom-input" rows="3"></textarea>
                    </div>

                    <div class="summary-card">
                        <h2>Sumar Comandă</h2>
                        
                        <div class="order-list" id="lista-produse">
                            </div>

                        <div style="text-align: right; color: #888; font-size: 0.9rem; margin-bottom: 5px;">
                            Livrare: <strong>Gratuită</strong>
                        </div>

                        <div class="total-display" id="total-comanda">
                            <span>Total:</span>
                            <span>0 RON</span>
                        </div>

                        <button type="submit" class="btn-finalizare">
                            CONFIRMĂ COMANDA
                        </button>
                        
                        <div style="text-align:center; margin-top:15px;">
                            <a href="#" onclick="golesteCos()" style="color:#d32f2f; font-size:0.9rem; text-decoration:underline;">
                                Golește Coșul
                            </a>
                        </div>
                    </div>

                </div>
            </form>

        </main>

        <footer class="site-footer">
            <p>&copy; 2026 Drone Management</p>
        </footer>
    </div>

    <script>
        let cos = JSON.parse(localStorage.getItem('cosCumparaturi')) || []; //citeste din local storage
        
        let containerProduse = document.getElementById('lista-produse');
        let textTotal = document.getElementById('total-comanda');
        let valoareTotal = textTotal.querySelector('span:last-child');
        
        function afiseazaCos() {
            if (cos.length === 0) {
                containerProduse.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">Coșul este gol.</p>';
                valoareTotal.innerText = '0 RON';
                return;
            }

            let html = '';
            let total = 0;

            cos.forEach((produs) => {
                html += `
                <div class="order-item">
                    <span>${produs.nume}</span>
                    <strong>${produs.pret} RON</strong>
                </div>`;
                
                let pretCurat = produs.pret.toString().replace(/[^0-9]/g, ''); // transforma pretul intr-un string si sterge RON
                total += parseInt(pretCurat);//transforma string-ul in numar
            });

            containerProduse.innerHTML = html;
            valoareTotal.innerText = total + ' RON';
        }

        function golesteCos() {
            if(confirm("Ești sigur că vrei să ștergi tot coșul?")) {
                localStorage.removeItem('cosCumparaturi');
                cos = [];
                afiseazaCos();
            }
        }

        function trimiteComanda(e) {
            e.preventDefault();
            if (cos.length === 0) {
                alert("Te rugăm să adaugi produse înainte de a comanda!");
                return;
            }
            alert("✅ Comanda a fost plasată cu succes! Mulțumim.");
            localStorage.removeItem('cosCumparaturi');
            cos = [];
            afiseazaCos();
            window.location.href = "Homepage.html";
        }

        afiseazaCos();
    </script>
</body>
</html>
