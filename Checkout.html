<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizare Comandă</title>
    <link rel="stylesheet" href="format.css">
</head>
<body>

    <div class="grid-container">
        <header class="site-header">
            <h1>Finalizare Comandă</h1>
        </header>

        <nav class="site-nav">
            <a href="Welcome.html">Welcome</a>
            <a href="Homepage.html">Homepage</a>
            <a href="Produse.html">Produse</a>
            <a href="Drone.html">Drone</a>
            <a href="Accesori.html">Accesorii</a>
            <a href="Newsletter.html">Newsletter</a>
            <a href="Checkout.html" class="active">Checkout</a>
        </nav>

        <main class="site-main">
            
            <div class="checkout-container">
                
                <div class="checkout-form">
                    <h2>Date de livrare</h2>
                    <form action="/action_page.php">
                        <label for="nume">Nume Complet</label>
                        <input type="text" id="nume" name="nume" placeholder="Ex: Ion Popescu" required>

                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" placeholder="ion@email.com" required>

                        <label for="adresa">Adresă de livrare</label>
                        <input type="text" id="adresa" name="adresa" placeholder="Strada, Număr, Bloc..." required>

                        <div class="form-row">
                            <div class="half-width">
                                <label for="oras">Oraș</label>
                                <input type="text" id="oras" name="oras" placeholder="București">
                            </div>
                            <div class="half-width">
                                <label for="cod">Cod Poștal</label>
                                <input type="text" id="cod" name="cod" placeholder="123456">
                            </div>
                        </div>

                        <h3>Date Card (Simulare)</h3>
                        <label for="card">Număr Card</label>
                        <input type="text" id="card" name="card" placeholder="1111-2222-3333-4444">

                        <input type="submit" value="Plătește Acum" class="btn-cumpara" style="width: 100%; border: none; cursor: pointer; margin-top: 20px;">
                    </form>
                </div>

                <div class="checkout-cart">
                    <div class="cart-box">
                        <h3>Coșul tău <span style="float:right">4 produse</span></h3>
                        <div class="cart-item">
                            <span>Drona Phantom X</span>
                            <span class="price">2500 RON</span>
                        </div>
                        <div class="cart-item">
                            <span>Baterie Extra</span>
                            <span class="price">450 RON</span>
                        </div>
                        <div class="cart-item">
                            <span>Set Elice</span>
                            <span class="price">120 RON</span>
                        </div>
                        <div class="cart-item">
                            <span>Taxă Livrare</span>
                            <span class="price">20 RON</span>
                        </div>
                        <hr>
                        <div class="cart-total">
                            <strong>Total</strong>
                            <strong class="price" style="color:black">3090 RON</strong>
                        </div>
                    </div>
                </div>

            </div>

        </main>

        <footer class="site-footer">
        </footer>

        <a href="#" id="backToTop">⬆ Sus</a>
    </div>

</body>
</html>
